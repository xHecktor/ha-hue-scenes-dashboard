# Reusable scene panel for one room.
# Put this whole block at the TOP LEVEL of your dashboard (next to `views:`),
# then use it per room (see example_room.yaml).
#
# Per room you pass only:  room: <group_name>
#
# Requires HACS cards: config-template-card, swipe-card, card-mod, decluttering-card
# and a global input_number set (see packages/hue_scenes.yaml).

decluttering_templates:
  scene_room:
    card:
      square: false
      type: grid
      columns: 1
      cards:
        # ---- Block 1: standard scenes, fixed order ----
        - type: custom:config-template-card
          variables:
            SCENES: >-
              let ROOM='[[room]]';
              let NAMED=['Natürliches Licht','Hell','Kühl hell','Energie tanken','Konzentrieren','Lesen','Entspannen','Ruhephase','Nachtlicht'];
              let all=Object.keys(states).filter(k=>k.startsWith('scene.') && states[k].attributes.group_name===ROOM);
              NAMED.map(nm=>all.find(k=>states[k].attributes.name===nm)).filter(k=>k)
            SLIDESPERVIEW: parseFloat(states['input_number.dashboard_scenes_slidesperview'].state);
            MOMENTUMRATIO: parseFloat(states['input_number.dashboard_scenes_freemodemomentumratio'].state);
            MOMENTUMVEL: parseFloat(states['input_number.dashboard_scenes_freemodemomentumvelocityratio'].state);
          entities:
            - ${SCENES}
            - pyscript.scene_tracker
            - input_text.dynamic_scenes
            - sensor.dynamische_szenen
            - input_number.dashboard_scenes_slidesperview
            - input_number.dashboard_scenes_freemodemomentumratio
            - input_number.dashboard_scenes_freemodemomentumvelocityratio
          card:
            type: custom:swipe-card
            parameters:
              slidesPerView: ${SLIDESPERVIEW}
              spaceBetween: 8
              freeMode: true
              freeModeMomentum: true
              freeModeMomentumRatio: ${MOMENTUMRATIO}
              freeModeMomentumVelocityRatio: ${MOMENTUMVEL}
            cards: |-
              ${
                let cards=[];
                let baseColor=null;
                let COLOR_SELECTED='rgba(255,152,0,0.42)';
                let COLOR_DYNAMIC='rgba(244,67,54,0.45)';
                let staticMap={}; try{staticMap=states['pyscript.scene_tracker'].attributes.active_scene||{};}catch(e){}
                let dynMap={}; try{dynMap=JSON.parse(states['input_text.dynamic_scenes'].state||'{}');}catch(e){}
                SCENES.map(entity=>{
                  let attrs=states[entity].attributes;
                  let room=attrs.group_name;
                  let roomDynamic=Object.keys(dynMap).includes(room);
                  let tile={
                    'type':'tile','entity':entity,'name':(attrs.name||entity.split('.').pop()),
                    'vertical':true,'hide_state':true,
                    'tap_action':{'action':'perform-action','perform_action':'script.scene_select','data':{'scene':entity}},
                    'double_tap_action':{'action':'perform-action','perform_action':'script.dynamic_scene_activate','data':{'scene':entity}}
                  };
                  if(baseColor){tile.color=baseColor;}
                  if(attrs.is_dynamic===true){tile.icon='mdi:auto-fix';}
                  let bg=null;
                  if(roomDynamic && entity===dynMap[room]){bg=COLOR_DYNAMIC;}
                  else if(!roomDynamic && entity===staticMap[room]){bg=COLOR_SELECTED;}
                  if(bg){tile['card_mod']={'style':'ha-card { background: '+bg+' !important; }'};}
                  cards=cards.concat(tile);
                });
                cards;
              }
        # ---- Block 2: bright tier ----
        - type: custom:config-template-card
          variables:
            SCENES: >-
              let ROOM='[[room]]';
              let NAMED=['Natürliches Licht','Hell','Kühl hell','Energie tanken','Konzentrieren','Lesen','Entspannen','Ruhephase','Nachtlicht'];
              let B1=parseInt(states['input_number.dashboard_scenes_brightness_1'].state);
              Object.keys(states).filter(k=>k.startsWith('scene.') && states[k].attributes.group_name===ROOM && NAMED.indexOf(states[k].attributes.name)<0)
              .filter(k=>{let b=states[k].attributes.brightness; return b && b>B1 && b<=255;}).sort()
            SLIDESPERVIEW: parseFloat(states['input_number.dashboard_scenes_slidesperview'].state);
            MOMENTUMRATIO: parseFloat(states['input_number.dashboard_scenes_freemodemomentumratio'].state);
            MOMENTUMVEL: parseFloat(states['input_number.dashboard_scenes_freemodemomentumvelocityratio'].state);
          entities:
            - ${SCENES}
            - pyscript.scene_tracker
            - input_text.dynamic_scenes
            - sensor.dynamische_szenen
            - input_number.dashboard_scenes_brightness_1
            - input_number.dashboard_scenes_slidesperview
            - input_number.dashboard_scenes_freemodemomentumratio
            - input_number.dashboard_scenes_freemodemomentumvelocityratio
          card:
            type: custom:swipe-card
            parameters:
              slidesPerView: ${SLIDESPERVIEW}
              spaceBetween: 8
              freeMode: true
              freeModeMomentum: true
              freeModeMomentumRatio: ${MOMENTUMRATIO}
              freeModeMomentumVelocityRatio: ${MOMENTUMVEL}
            cards: |-
              ${
                let cards=[];
                let baseColor='orange';
                let COLOR_SELECTED='rgba(255,152,0,0.42)';
                let COLOR_DYNAMIC='rgba(244,67,54,0.45)';
                let staticMap={}; try{staticMap=states['pyscript.scene_tracker'].attributes.active_scene||{};}catch(e){}
                let dynMap={}; try{dynMap=JSON.parse(states['input_text.dynamic_scenes'].state||'{}');}catch(e){}
                SCENES.map(entity=>{
                  let attrs=states[entity].attributes;
                  let room=attrs.group_name;
                  let roomDynamic=Object.keys(dynMap).includes(room);
                  let tile={
                    'type':'tile','entity':entity,'name':(attrs.name||entity.split('.').pop()),
                    'vertical':true,'hide_state':true,
                    'tap_action':{'action':'perform-action','perform_action':'script.scene_select','data':{'scene':entity}},
                    'double_tap_action':{'action':'perform-action','perform_action':'script.dynamic_scene_activate','data':{'scene':entity}}
                  };
                  if(baseColor){tile.color=baseColor;}
                  if(attrs.is_dynamic===true){tile.icon='mdi:auto-fix';}
                  let bg=null;
                  if(roomDynamic && entity===dynMap[room]){bg=COLOR_DYNAMIC;}
                  else if(!roomDynamic && entity===staticMap[room]){bg=COLOR_SELECTED;}
                  if(bg){tile['card_mod']={'style':'ha-card { background: '+bg+' !important; }'};}
                  cards=cards.concat(tile);
                });
                cards;
              }
        # ---- Block 3: mid tier ----
        - type: custom:config-template-card
          variables:
            SCENES: >-
              let ROOM='[[room]]';
              let NAMED=['Natürliches Licht','Hell','Kühl hell','Energie tanken','Konzentrieren','Lesen','Entspannen','Ruhephase','Nachtlicht'];
              let B1=parseInt(states['input_number.dashboard_scenes_brightness_1'].state);
              let B2=parseInt(states['input_number.dashboard_scenes_brightness_2'].state);
              Object.keys(states).filter(k=>k.startsWith('scene.') && states[k].attributes.group_name===ROOM && NAMED.indexOf(states[k].attributes.name)<0)
              .filter(k=>{let b=states[k].attributes.brightness; return b && b>B2 && b<=B1;}).sort()
            SLIDESPERVIEW: parseFloat(states['input_number.dashboard_scenes_slidesperview'].state);
            MOMENTUMRATIO: parseFloat(states['input_number.dashboard_scenes_freemodemomentumratio'].state);
            MOMENTUMVEL: parseFloat(states['input_number.dashboard_scenes_freemodemomentumvelocityratio'].state);
          entities:
            - ${SCENES}
            - pyscript.scene_tracker
            - input_text.dynamic_scenes
            - sensor.dynamische_szenen
            - input_number.dashboard_scenes_brightness_1
            - input_number.dashboard_scenes_brightness_2
            - input_number.dashboard_scenes_slidesperview
            - input_number.dashboard_scenes_freemodemomentumratio
            - input_number.dashboard_scenes_freemodemomentumvelocityratio
          card:
            type: custom:swipe-card
            parameters:
              slidesPerView: ${SLIDESPERVIEW}
              spaceBetween: 8
              freeMode: true
              freeModeMomentum: true
              freeModeMomentumRatio: ${MOMENTUMRATIO}
              freeModeMomentumVelocityRatio: ${MOMENTUMVEL}
            cards: |-
              ${
                let cards=[];
                let baseColor='teal';
                let COLOR_SELECTED='rgba(255,152,0,0.42)';
                let COLOR_DYNAMIC='rgba(244,67,54,0.45)';
                let staticMap={}; try{staticMap=states['pyscript.scene_tracker'].attributes.active_scene||{};}catch(e){}
                let dynMap={}; try{dynMap=JSON.parse(states['input_text.dynamic_scenes'].state||'{}');}catch(e){}
                SCENES.map(entity=>{
                  let attrs=states[entity].attributes;
                  let room=attrs.group_name;
                  let roomDynamic=Object.keys(dynMap).includes(room);
                  let tile={
                    'type':'tile','entity':entity,'name':(attrs.name||entity.split('.').pop()),
                    'vertical':true,'hide_state':true,
                    'tap_action':{'action':'perform-action','perform_action':'script.scene_select','data':{'scene':entity}},
                    'double_tap_action':{'action':'perform-action','perform_action':'script.dynamic_scene_activate','data':{'scene':entity}}
                  };
                  if(baseColor){tile.color=baseColor;}
                  if(attrs.is_dynamic===true){tile.icon='mdi:auto-fix';}
                  let bg=null;
                  if(roomDynamic && entity===dynMap[room]){bg=COLOR_DYNAMIC;}
                  else if(!roomDynamic && entity===staticMap[room]){bg=COLOR_SELECTED;}
                  if(bg){tile['card_mod']={'style':'ha-card { background: '+bg+' !important; }'};}
                  cards=cards.concat(tile);
                });
                cards;
              }
        # ---- Block 4: dark tier ----
        - type: custom:config-template-card
          variables:
            SCENES: >-
              let ROOM='[[room]]';
              let NAMED=['Natürliches Licht','Hell','Kühl hell','Energie tanken','Konzentrieren','Lesen','Entspannen','Ruhephase','Nachtlicht'];
              let B2=parseInt(states['input_number.dashboard_scenes_brightness_2'].state);
              Object.keys(states).filter(k=>k.startsWith('scene.') && states[k].attributes.group_name===ROOM && NAMED.indexOf(states[k].attributes.name)<0)
              .filter(k=>{let b=states[k].attributes.brightness; return b>=0 && b<=B2;}).sort()
            SLIDESPERVIEW: parseFloat(states['input_number.dashboard_scenes_slidesperview'].state);
            MOMENTUMRATIO: parseFloat(states['input_number.dashboard_scenes_freemodemomentumratio'].state);
            MOMENTUMVEL: parseFloat(states['input_number.dashboard_scenes_freemodemomentumvelocityratio'].state);
          entities:
            - ${SCENES}
            - pyscript.scene_tracker
            - input_text.dynamic_scenes
            - sensor.dynamische_szenen
            - input_number.dashboard_scenes_brightness_2
            - input_number.dashboard_scenes_slidesperview
            - input_number.dashboard_scenes_freemodemomentumratio
            - input_number.dashboard_scenes_freemodemomentumvelocityratio
          card:
            type: custom:swipe-card
            parameters:
              slidesPerView: ${SLIDESPERVIEW}
              spaceBetween: 8
              freeMode: true
              freeModeMomentum: true
              freeModeMomentumRatio: ${MOMENTUMRATIO}
              freeModeMomentumVelocityRatio: ${MOMENTUMVEL}
            cards: |-
              ${
                let cards=[];
                let baseColor='purple';
                let COLOR_SELECTED='rgba(255,152,0,0.42)';
                let COLOR_DYNAMIC='rgba(244,67,54,0.45)';
                let staticMap={}; try{staticMap=states['pyscript.scene_tracker'].attributes.active_scene||{};}catch(e){}
                let dynMap={}; try{dynMap=JSON.parse(states['input_text.dynamic_scenes'].state||'{}');}catch(e){}
                SCENES.map(entity=>{
                  let attrs=states[entity].attributes;
                  let room=attrs.group_name;
                  let roomDynamic=Object.keys(dynMap).includes(room);
                  let tile={
                    'type':'tile','entity':entity,'name':(attrs.name||entity.split('.').pop()),
                    'vertical':true,'hide_state':true,
                    'tap_action':{'action':'perform-action','perform_action':'script.scene_select','data':{'scene':entity}},
                    'double_tap_action':{'action':'perform-action','perform_action':'script.dynamic_scene_activate','data':{'scene':entity}}
                  };
                  if(baseColor){tile.color=baseColor;}
                  if(attrs.is_dynamic===true){tile.icon='mdi:auto-fix';}
                  let bg=null;
                  if(roomDynamic && entity===dynMap[room]){bg=COLOR_DYNAMIC;}
                  else if(!roomDynamic && entity===staticMap[room]){bg=COLOR_SELECTED;}
                  if(bg){tile['card_mod']={'style':'ha-card { background: '+bg+' !important; }'};}
                  cards=cards.concat(tile);
                });
                cards;
              }
        # ---- Speed slider: only visible while the room is playing dynamic ----
        - type: custom:config-template-card
          variables:
            SPEED: >-
              'input_number.' + '[[room]]'.toLowerCase()
                .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')
                .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_dynamic_speed'
            HIDE: >-
              Object.keys(JSON.parse(states['input_text.dynamic_scenes'].state||'{}')).includes('[[room]]') ? '' : 'display:none !important;'
          entities:
            - input_text.dynamic_scenes
            - ${SPEED}
          card:
            type: tile
            entity: ${SPEED}
            name: Speed
            features:
              - type: numeric-input
                style: slider
            card_mod:
              style: |
                ha-card { ${HIDE} }
