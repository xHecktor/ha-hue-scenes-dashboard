# One card per room OR zone. Put these inside a view.
# `room` must be the exact Hue group_name (works the same for rooms and zones).
# List all room/zone names via Developer Tools > Template:
#   {{ states.scene | map(attribute='attributes.group_name') | reject('none') | unique | list }}
# Or only the zones:
#   {{ states.scene | selectattr('attributes.group_type','eq','zone')
#      | map(attribute='attributes.group_name') | reject('none') | unique | list }}

- type: custom:decluttering-card
  template: scene_room
  variables:
    - room: Wohnzimmer

- type: custom:decluttering-card
  template: scene_room
  variables:
    - room: Schlafzimmer

# Rooms with spaces / special characters must be quoted:
- type: custom:decluttering-card
  template: scene_room
  variables:
    - room: "Balkon Südost"

# A Hue ZONE is used exactly like a room — just pass its group_name.
# (The zone's native Hue group light is found automatically.)
- type: custom:decluttering-card
  template: scene_room
  variables:
    - room: Weihnachtsbeleuchtung

- type: custom:decluttering-card
  template: scene_room
  variables:
    - room: "Wohnz. Stehlampen"
