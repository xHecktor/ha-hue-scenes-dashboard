# Admin card for calibration & diagnosis. Pick an "Aufgabe" (task) and only that
# section is shown, so the card stays small. Nothing here runs in parallel with
# the other task.
#
#   Aufgabe = Kalibrieren -> settle, Kontrast, Räume gleichzeitig, Start/Stop
#   Aufgabe = Diagnose    -> Diagnose-Art (Erkennung schnell/voll, Dim-Drift),
#                            settle, Start/Stop
#
# Status rows read the `label` of pyscript.calibration / pyscript.scene_diagnose:
# idle -> expected runtime for the current selection; running -> elapsed / total
# (the elapsed clock ticks every second). Both entities are created at startup,
# so no "entity not found" after a restart.

type: vertical-stack
cards:
  - type: entities
    title: Kalibrieren & Diagnose
    entities:
      - entity: input_select.hue_task_mode
        name: Aufgabe
      - entity: input_select.calibrate_room
        name: Bereich

  # --- Kalibrieren -------------------------------------------------------
  - type: conditional
    conditions:
      - entity: input_select.hue_task_mode
        state: Kalibrieren
    card:
      type: entities
      entities:
        - entity: input_number.calibrate_settle
          name: Einschwingzeit (s)
        - entity: input_boolean.calibrate_contrast
          name: Kontrast-Modus (gründlich)
        - entity: input_number.calibrate_parallel
          name: Räume gleichzeitig
        - type: attribute
          entity: pyscript.calibration
          attribute: label
          name: Status
          icon: mdi:fingerprint
        - type: buttons
          entities:
            - entity: script.scene_calibrate_selected
              name: Kalibrieren
              icon: mdi:play
              tap_action:
                action: perform-action
                perform_action: script.scene_calibrate_selected
                confirmation:
                  text: >-
                    Kalibrierung starten? Die Lampen flackern kurz durch die
                    Szenen (im Kontrast-Modus etwa doppelt so lange).
            - entity: pyscript.scene_fingerprint_calibrate_stop
              name: Stop
              icon: mdi:stop
              tap_action:
                action: perform-action
                perform_action: pyscript.scene_fingerprint_calibrate_stop

  # --- Diagnose (read-only) ---------------------------------------------
  - type: conditional
    conditions:
      - entity: input_select.hue_task_mode
        state: Diagnose
    card:
      type: entities
      entities:
        - entity: input_select.hue_diagnose_type
          name: Diagnose-Art
        - entity: input_number.calibrate_settle
          name: Einschwingzeit (s)
        - type: attribute
          entity: pyscript.scene_diagnose
          attribute: label
          name: Status
          icon: mdi:magnify-scan
        - type: buttons
          entities:
            - entity: script.scene_diagnose_selected
              name: Diagnose
              icon: mdi:play-circle-outline
              tap_action:
                action: perform-action
                perform_action: script.scene_diagnose_selected
                confirmation:
                  text: >-
                    Diagnose starten? Fährt Szenen an und prüft die Erkennung
                    (nur lesend, ändert die Datenbank nicht). Report unter
                    /config/hue_scenes/.
            - entity: pyscript.scene_diagnose_stop
              name: Stop
              icon: mdi:stop
              tap_action:
                action: perform-action
                perform_action: pyscript.scene_diagnose_stop
