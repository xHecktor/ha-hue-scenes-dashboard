# Compact calibration card: pick a room (or "Alle Räume") and start.
# Lights briefly flash through every scene while calibrating.

type: entities
title: Kalibrieren
entities:
  - entity: input_select.calibrate_room
    name: Bereich
  - type: attribute
    entity: pyscript.calibration
    attribute: label
    name: Status
    icon: mdi:fingerprint
footer:
  type: buttons
  entities:
    - entity: script.scene_calibrate_selected
      name: Start
      icon: mdi:play
      tap_action:
        action: perform-action
        perform_action: script.scene_calibrate_selected
        confirmation:
          text: Kalibrierung starten? Die Lampen flackern kurz durch die Szenen.
