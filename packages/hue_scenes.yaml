# Hue dynamic-scene control + active-scene tracking
# Drop this into config/packages/ (needs `homeassistant: packages:` enabled)
# or split the blocks into your configuration.yaml.
#
# Entity names are kept as-is (German) to match the pyscript/dashboard;
# if you rename anything, keep it consistent across all three.

template:
  - sensor:
      # Number of rooms currently playing a *dynamic* Hue scene.
      # active_rooms = the room (area) names that are dynamic right now.
      - name: "Dynamische Szenen"
        unique_id: dynamische_szenen_aktiv
        icon: mdi:auto-fix
        state: >
          {{ states.light
             | selectattr('state', 'eq', 'on')
             | selectattr('attributes.dynamics', 'eq', 'dynamic_palette')
             | map(attribute='entity_id') | map('area_name')
             | reject('none') | unique | list | count }}
        attributes:
          active_rooms: >
            {{ states.light
               | selectattr('state', 'eq', 'on')
               | selectattr('attributes.dynamics', 'eq', 'dynamic_palette')
               | map(attribute='entity_id') | map('area_name')
               | reject('none') | unique | list }}


input_text:
  # {room: scene} map of the currently running dynamic scene per room.
  dynamic_scenes:
    name: Active dynamic scenes
    max: 255
    initial: "{}"

  # Id of the device (browser) that last tapped a scene. The dashboard on
  # that device keeps the normal scene order; every other (passive) device
  # pulls the active scene to the front. Set by scene_select /
  # dynamic_scene_activate from a per-browser localStorage id.
  scene_active_device:
    name: Active scene device
    max: 255
    initial: ""


input_number:
  # --- Dashboard controls (brightness tier thresholds + swipe tuning) ---
  dashboard_scenes_brightness_1:
    name: Scene brightness 1 (upper threshold)
    min: 0
    max: 255
    step: 1
    mode: box
    initial: 200
  dashboard_scenes_brightness_2:
    name: Scene brightness 2 (lower threshold)
    min: 0
    max: 255
    step: 1
    mode: box
    initial: 100
  dashboard_scenes_slidesperview:
    name: Scenes per row
    min: 1
    max: 6
    step: 0.05
    mode: box
    initial: 3
  dashboard_scenes_freemodemomentumratio:
    name: FreeMode momentum ratio
    min: 0
    max: 2
    step: 0.05
    mode: box
    initial: 1
  dashboard_scenes_freemodemomentumvelocityratio:
    name: FreeMode momentum velocity
    min: 0
    max: 2
    step: 0.05
    mode: box
    initial: 1

  # --- Calibration settle time (seconds to wait per scene before measuring) ---
  calibrate_settle:
    name: Settle (s)
    min: 2
    max: 15
    step: 1
    mode: slider
    initial: 10
    icon: mdi:timer-sand

  # How many rooms to calibrate at once (whole-home only). Commands are
  # rate-limited, so this mainly overlaps the settle waits. Default 1 (safest;
  # no parallel flashing, easiest on the bridge).
  calibrate_parallel:
    name: Rooms at once
    min: 1
    max: 4
    step: 1
    mode: slider
    initial: 1
    icon: mdi:home-group

  # --- Per-room dynamic speed (one line per room via the anchor) ---
  wohnzimmer_dynamic_speed: &dyn_speed
    name: Speed
    min: 0
    max: 100
    step: 1
    mode: slider
    icon: mdi:speedometer
  # schlafzimmer_dynamic_speed: *dyn_speed
  # <slug>_dynamic_speed: *dyn_speed


input_select:
  # Room picker for the calibration admin card (options auto-filled at startup).
  calibrate_room:
    name: Room to calibrate
    icon: mdi:home-search
    options:
      - "…"

  # Which task the admin card runs (the card shows only the chosen section).
  hue_task_mode:
    name: Aufgabe
    icon: mdi:cog-outline
    options:
      - Kalibrieren
      - Diagnose
    initial: Kalibrieren

  # Which diagnose to run when Aufgabe = Diagnose.
  hue_diagnose_type:
    name: Diagnose-Art
    icon: mdi:magnify-scan
    options:
      - "Erkennung – schnell"
      - "Erkennung – voll"
      - "Dim-Drift"
    initial: "Erkennung – schnell"


input_boolean:
  # Thorough calibration: run each scene twice from opposite states to detect
  # lamps a scene does not control (~2x flashing). Off = fast single pass.
  calibrate_contrast:
    name: Contrast mode (thorough)
    icon: mdi:contrast-box
    # Default ON: contrast is the reliable way to detect uncontrolled attributes
    # (a scene that leaves a lamp's colour temperature free, etc.). Turn it off
    # only for a quick re-capture of scenes you know drive every lamp.
    initial: "on"


# When a device taps a scene it becomes the "active" device (keeps its scene
# order / scroll position while passive displays follow the highlight). This
# timer is (re)started on every tap; when it elapses -- i.e. a few minutes after
# the LAST tap on that device -- the device is released back to passive. Adjust
# `duration` to taste.
timer:
  scene_active_device:
    name: Active scene device idle timer
    duration: "00:03:00"
    restore: true


script:
  # Tap: activate a scene statically, mark it active instantly, and (re)learn
  # its fingerprint from the resulting light state.
  scene_select:
    alias: "Select scene"
    mode: queued
    fields:
      scene:
        description: "Scene (scene.*)"
      device:
        description: "Calling browser id (for per-device scene ordering)"
        default: ""
    sequence:
      # Remember which device tapped, so its dashboard keeps the normal order.
      - action: input_text.set_value
        target:
          entity_id: input_text.scene_active_device
        data:
          value: "{{ device | default('') }}"
      # (Re)start the idle timer so the device is released back to passive a few
      # minutes after its last tap. Skipped if no device id was passed.
      - if: "{{ (device | default('')) != '' }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.scene_active_device
      - action: scene.turn_on
        target:
          entity_id: "{{ scene }}"
      - action: pyscript.scene_set_active
        data:
          room: "{{ state_attr(scene, 'group_name') }}"
          scene: "{{ scene }}"
      - action: pyscript.scene_learn
        data:
          scene: "{{ scene }}"
      # a static pick means the room is no longer dynamic -> drop it from the map
      - variables:
          room: "{{ state_attr(scene, 'group_name') }}"
          cur_dyn: >-
            {{ (states('input_text.dynamic_scenes') | from_json)
               if states('input_text.dynamic_scenes') not in ['', 'unknown', 'unavailable']
               else {} }}
      - action: input_text.set_value
        target:
          entity_id: input_text.dynamic_scenes
        data:
          value: >-
            {% set ns = namespace(d={}) %}
            {% for k, v in cur_dyn.items() if k != room %}
              {% set ns.d = ns.d | combine({k: v}) %}
            {% endfor %}
            {{ ns.d | to_json }}

  # Double tap: activate dynamically, record it, and set the room's speed
  # slider to the scene's own default speed.
  dynamic_scene_activate:
    alias: "Activate dynamic scene"
    mode: queued
    fields:
      scene:
        description: "Scene (scene.*)"
      device:
        description: "Calling browser id (for per-device scene ordering)"
        default: ""
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.scene_active_device
        data:
          value: "{{ device | default('') }}"
      - if: "{{ (device | default('')) != '' }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.scene_active_device
      - action: hue.activate_scene
        target:
          entity_id: "{{ scene }}"
        data:
          dynamic: true
      - variables:
          room: "{{ state_attr(scene, 'group_name') }}"
          current_dyn: >-
            {{ (states('input_text.dynamic_scenes') | from_json)
               if states('input_text.dynamic_scenes') not in ['', 'unknown', 'unavailable']
               else {} }}
          # Tolerate umlaut spelling: prefer the slugify form (ü->u), fall
          # back to the German ue/oe/ae/ss form if only that helper exists.
          speed_entity: >-
            {%- set a = 'input_number.' ~ (room | slugify) ~ '_dynamic_speed' -%}
            {%- set de = room | lower | replace('ä','ae') | replace('ö','oe') | replace('ü','ue') | replace('ß','ss') -%}
            {%- set b = 'input_number.' ~ (de | slugify) ~ '_dynamic_speed' -%}
            {{ b if (states(b) not in ['unknown','unavailable'] and states(a) in ['unknown','unavailable']) else a }}
          speed_pct: "{{ (state_attr(scene, 'speed') | float(0) * 100) | round(0) | int }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.dynamic_scenes
        data:
          value: "{{ current_dyn | combine({room: scene}) | to_json }}"
      - if: "{{ states(speed_entity) not in ['unknown', 'unavailable'] }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: "{{ speed_entity }}"
            data:
              value: "{{ speed_pct }}"

  # Remote: step to the next/previous scene in the dashboard order.
  scene_cycle:
    alias: "Cycle scene"
    mode: queued
    fields:
      room:
        description: "Room name (group_name)"
      step:
        description: "1 = forward, -1 = backward"
        default: 1
      exclude:
        description: "Scenes to skip (scene.*)"
        default: []
    sequence:
      - variables:
          B1: "{{ states('input_number.dashboard_scenes_brightness_1') | int }}"
          B2: "{{ states('input_number.dashboard_scenes_brightness_2') | int }}"
          pool: >-
            {{ states.scene
               | selectattr('attributes.group_name', 'defined')
               | selectattr('attributes.group_name', 'eq', room)
               | selectattr('attributes.brightness', 'defined')
               | map(attribute='entity_id') | list
               | reject('in', exclude) | list }}
          bright: >-
            {{ states.scene | selectattr('entity_id', 'in', pool)
               | selectattr('attributes.brightness', 'gt', B1)
               | map(attribute='entity_id') | list | sort }}
          mid: >-
            {{ states.scene | selectattr('entity_id', 'in', pool)
               | selectattr('attributes.brightness', 'gt', B2)
               | selectattr('attributes.brightness', 'le', B1)
               | map(attribute='entity_id') | list | sort }}
          dark: >-
            {{ states.scene | selectattr('entity_id', 'in', pool)
               | selectattr('attributes.brightness', 'le', B2)
               | map(attribute='entity_id') | list | sort }}
          scenes: "{{ bright + mid + dark }}"
          current: "{{ (state_attr('pyscript.scene_tracker','active_scene') or {}).get(room) }}"
          idx: "{{ scenes.index(current) if current in scenes else -1 }}"
          next: >-
            {{ scenes[(idx + (step | int)) % (scenes | length)]
               if scenes | length > 0 else none }}
      - if: "{{ next not in [none, ''] }}"
        then:
          - action: script.scene_select
            data:
              scene: "{{ next }}"

  # Calibrate the room chosen in the picker (button cards can't template data).
  scene_calibrate_selected:
    alias: "Calibrate selected room"
    sequence:
      - variables:
          sel: "{{ states('input_select.calibrate_room') }}"
      - action: pyscript.scene_fingerprint_calibrate
        data:
          # Pass the selection verbatim; pyscript (_resolve_scope) maps
          # "Alle Räume + Zonen" -> everything, "── Räume ──"/"── Zonen ──" ->
          # all rooms / all zones, and a name -> just that area.
          room: "{{ sel }}"
          settle: "{{ states('input_number.calibrate_settle') | int(10) }}"
          contrast: "{{ is_state('input_boolean.calibrate_contrast', 'on') }}"
          parallel: "{{ states('input_number.calibrate_parallel') | int(1) }}"

  # Diagnose the room chosen in the same picker (read-only). Which diagnose is
  # chosen by input_select.hue_diagnose_type.
  scene_diagnose_selected:
    alias: "Diagnose selected room"
    variables:
      sel: "{{ states('input_select.calibrate_room') }}"
      # Diagnose takes a single area or whole-home; treat the "all" entry and the
      # group headers as whole-home (headers are a calibration-only shortcut).
      room: >-
        {{ '' if (sel in ['Alle Räume', 'Alle Räume + Zonen', '…']
                  or sel.startswith('──')) else sel }}
      dtype: "{{ states('input_select.hue_diagnose_type') }}"
    sequence:
      - choose:
          - conditions: "{{ dtype == 'Dim-Drift' }}"
            sequence:
              - action: pyscript.scene_dim_drift
                data:
                  room: "{{ room }}"
          - conditions: "{{ dtype == 'Erkennung – voll' }}"
            sequence:
              - action: pyscript.scene_diagnose
                data:
                  room: "{{ room }}"
                  mode: full
        default:
          - action: pyscript.scene_diagnose
            data:
              room: "{{ room }}"
              mode: quick
              settle: "{{ states('input_number.calibrate_settle') | int(10) }}"


automation:
  # Release the active device back to passive a few minutes after its last tap:
  # when the idle timer elapses, clear scene_active_device so that device starts
  # following the active-scene highlight/reorder again like any passive display.
  - alias: "Scene: release active device when idle"
    id: scene_active_device_release
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.scene_active_device
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.scene_active_device
        data:
          value: ""

  # Apply the per-room speed slider to that room's running dynamic scene.
  # (The dynamic-scene map is pruned by pyscript + scene_select, so no sync
  # automation is needed.)
  # Add one entity_id line per room.
  - alias: "Apply dynamic speed"
    id: dynamic_speed_apply
    mode: restart
    triggers:
      - trigger: state
        for: "00:00:01"
        entity_id:
          - input_number.wohnzimmer_dynamic_speed
          # - input_number.<slug>_dynamic_speed
    variables:
      slug: "{{ trigger.entity_id.split('.')[1] | replace('_dynamic_speed','') }}"
      room: >-
        {%- set ns = namespace(match='') -%}
        {%- set dmap = (states('input_text.dynamic_scenes') | from_json)
              if states('input_text.dynamic_scenes') not in ['', 'unknown', 'unavailable'] else {} -%}
        {%- for r in dmap.keys() -%}
          {%- set de = r | lower | replace('ä','ae') | replace('ö','oe') | replace('ü','ue') | replace('ß','ss') -%}
          {%- if r | slugify == slug or de | slugify == slug -%}{%- set ns.match = r -%}{%- endif -%}
        {%- endfor -%}
        {{- ns.match -}}
      scene: "{{ (states('input_text.dynamic_scenes') | from_json).get(room) }}"
    conditions:
      - condition: template
        value_template: "{{ room != '' }}"
      - condition: template
        value_template: "{{ scene not in (none, '', 'unknown') }}"
    actions:
      - action: hue.activate_scene
        target:
          entity_id: "{{ scene }}"
        data:
          dynamic: true
          speed: "{{ trigger.to_state.state | int }}"

  # NOTE: the calibration room picker (input_select.calibrate_room) is filled by
  # pyscript (scene_fingerprints._populate_room_select, on startup and via the
  # scene_fingerprint_refresh_rooms service), so it reliably includes every room
  # AND the whole-home zones without a fixed start-up delay.
